<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-md w-full text-center space-y-4 shadow-xl">
        <div class="text-3xl">⚠️</div>
        <h2 class="text-xl font-bold text-red-400">Confirmar Exclusão</h2>
        <p class="text-slate-400 text-sm">Tem certeza que deseja apagar a ficha <span class="text-slate-200 font-semibold">"{{ objeto.nome }}"</span>? Esta ação não poderá ser desfeita.</p>
        
        <form method="POST" class="flex items-center justify-center gap-3 pt-2">
            {% csrf_token %}
            <a href="{% url 'index' %}" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-semibold transition">Cancelar</a>
            <button type="submit" class="px-4 py-2 bg-red-600 hover:bg-red-500 rounded-lg text-sm font-semibold text-white transition">Apagar Permanentemente</button>
        </form>
    </div>
</body>
</html>
