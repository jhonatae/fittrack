<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Novo Exercício</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <header class="w-full bg-slate-950">
        <div class="max-w-4xl mx-auto px-6 py-6 flex items-center justify-between">
            <div class="font-bold text-lg tracking-wide text-slate-200">
                <a href="{% url 'index' %}">FitTrack<span class="text-emerald-400">.</span></a>
            </div>
            <nav>
                <a href="{% url 'index' %}" class="text-sm text-slate-400 hover:text-emerald-400 transition">Voltar ao Início</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-xl mx-auto px-6 py-12 w-full">
        <div class="space-y-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-100">Cadastrar Exercício</h1>
                <p class="text-sm text-slate-400 mt-1">Adicione um novo exercício ao catálogo geral do FitTrack.</p>
            </div>

            <form method="POST" class="space-y-5">
                {% csrf_token %} {% for field in form %}
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-300">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                            <p class="text-xs text-red-400">{{ field.errors.0 }}</p>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-sm font-bold py-2.5 rounded-lg transition shadow-lg shadow-emerald-500/10 mt-4">
                    Salvar Exercício
                </button>
            </form>
        </div>
    </main>

    <footer class="w-full border-t border-white/10 py-6 bg-slate-950 text-center text-slate-500 text-xs">
        FitTrack · Disciplina de Programação Web
    </footer>

</body>
</html>
