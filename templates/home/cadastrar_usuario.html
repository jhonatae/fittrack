<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Criar Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <header class="w-full bg-slate-950">
        <div class="max-w-4xl mx-auto px-6 py-6 flex items-center justify-between">
            <div class="font-bold text-lg tracking-wide text-slate-200">
                <a href="{% url 'index' %}">FitTrack<span class="text-emerald-400">.</span></a>
            </div>
            <a href="{% url 'login' %}" class="text-sm text-slate-400 hover:text-emerald-400 transition">Já tenho conta</a>
        </div>
    </header>

    <main class="flex-grow max-w-md mx-auto px-6 py-12 w-full flex flex-col justify-center">
        <div class="space-y-6">
            <div class="text-center">
                <h1 class="text-2xl font-bold text-slate-100">Crie sua conta</h1>
                <p class="text-sm text-slate-400 mt-1">Cadastre-se para começar a gerenciar seus treinos.</p>
            </div>

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="space-y-1">
                        <label class="block text-xs font-medium text-slate-400">
                            {{ field.label }}
                        </label>
                        <div class="text-slate-300 [&_input]:w-full [&_input]:bg-slate-900 [&_input]:border [&_input]:border-slate-700 [&_input]:rounded-lg [&_input]:px-4 [&_input]:py-2 [&_input]:text-slate-100 [&_input]:focus:border-emerald-500 [&_input]:focus:outline-none [&_input]:transition [&_span_class=helptext]:text-[10px] [&_span_class=helptext]:text-slate-500 [&_span_class=helptext]:block [&_span_class=helptext]:mt-1">
                            {{ field }}
                        </div>
                        {% if field.errors %}
                            <p class="text-xs text-red-400">{{ field.errors.0 }}</p>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-sm font-bold py-2.5 rounded-lg transition shadow-lg shadow-emerald-500/10 mt-6">
                    Criar Minha Conta
                </button>
            </form>
        </div>
    </main>

    <footer class="w-full border-t border-white/10 py-6 bg-slate-950 text-center text-slate-500 text-xs">
        FitTrack · Disciplina de Programação Web
    </footer>

</body>
</html>
